# Configuration file for Skip (https://skip.dev) project
#
# Kotlin dependencies and Gradle build options for this module can be configured here

# RevenueCat Android UI SDK dependency
skip:
  mode: 'transpiled'
  bridging: true

build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("com.revenuecat.purchases:purchases-ui:9.19.0")'
        - 'debugImplementation("com.revenuecat.purchases:purchases-debug-view:9.19.0")'
        - 'releaseImplementation("com.revenuecat.purchases:purchases-debug-view-noop:9.19.0")'
